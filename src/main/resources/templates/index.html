<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Complex Type Converter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <style>
        body { background: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 3rem 0 2rem; margin-bottom: 2rem; }
        .converter-badge { font-size: 0.75rem; background: #e9ecef; color: #495057; padding: 0.2rem 0.5rem; border-radius: 4px; display: inline-block; margin: 2px; }
    </style>
</head>
<body>

<div class="hero text-center">
    <h1 class="fw-bold">Complex Type Converter</h1>
    <p class="text-white-50 mb-0">Convert between Java types — JSON, XML, CSV, temporal and domain objects</p>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Conversion failed:</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header fw-semibold">Convert</div>
                <div class="card-body">
                    <form th:action="@{/convert}" th:object="${request}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">Source type</label>
                                <select class="form-select" th:field="*{sourceType}">
                                    <option value="" disabled selected>Select…</option>
                                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Target type</label>
                                <select class="form-select" th:field="*{targetType}">
                                    <option value="" disabled selected>Select…</option>
                                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Input value</label>
                            <textarea class="form-control font-monospace" rows="8" th:field="*{value}"
                                      placeholder="Paste your input here…"></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark btn-lg">Convert</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header fw-semibold">Registered converters</div>
                <div class="card-body">
                    <span th:each="c : ${converters}" class="converter-badge" th:text="${c}"></span>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
