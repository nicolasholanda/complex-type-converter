<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Error — Complex Type Converter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <style>
        body { background: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 3rem 0 2rem; margin-bottom: 2rem; }
    </style>
</head>
<body>

<div class="hero text-center">
    <h1 class="fw-bold">Complex Type Converter</h1>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="display-1 text-muted mb-3" th:text="${status}">500</div>
            <h4 class="mb-2" th:text="${error}">Something went wrong</h4>
            <p class="text-muted" th:text="${message}"></p>
            <a href="/" class="btn btn-dark mt-3">Back to converter</a>
        </div>
    </div>
</div>

</body>
</html>
