<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Result — Complex Type Converter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <style>
        body { background: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 3rem 0 2rem; margin-bottom: 2rem; }
        pre { white-space: pre-wrap; word-break: break-all; background: #212529; color: #f8f9fa; border-radius: 6px; padding: 1rem; font-size: 0.875rem; }
        .arrow { font-size: 1.5rem; color: #6c757d; }
    </style>
</head>
<body>

<div class="hero text-center">
    <h1 class="fw-bold">Complex Type Converter</h1>
    <p class="text-white-50 mb-0">Convert between Java types — JSON, XML, CSV, temporal and domain objects</p>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
                <span class="badge bg-secondary fs-6" th:text="${sourceType}"></span>
                <span class="arrow">→</span>
                <span class="badge bg-dark fs-6" th:text="${targetType}"></span>
            </div>

            <div class="card shadow-sm mb-3">
                <div class="card-header fw-semibold text-muted">Input</div>
                <div class="card-body p-0">
                    <pre th:text="${inputValue}"></pre>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header fw-semibold">Result</div>
                <div class="card-body p-0">
                    <pre th:text="${result}"></pre>
                </div>
            </div>

            <div class="text-center">
                <a href="/" class="btn btn-dark">Convert again</a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
